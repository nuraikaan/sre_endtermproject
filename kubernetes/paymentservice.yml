apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: webbackendfinal-paymentservice:latest
          ports:
            - containerPort: 3006
          envFrom:
            - secretRef:
                name: app-secret
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: microservices
spec:
  selector:
    app: paymentservice
  ports:
    - port: 3006
      targetPort: 3006