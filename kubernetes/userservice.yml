apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: webbackendfinal-userservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: app-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: microservices
spec:
  selector:
    app: userservice
  ports:
    - port: 3004
      targetPort: 3004
  type: NodePort