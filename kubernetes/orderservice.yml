apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: webbackendfinal-orderservice:latest
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: app-secret
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: microservices
spec:
  selector:
    app: orderservice
  ports:
    - port: 3002
      targetPort: 3002