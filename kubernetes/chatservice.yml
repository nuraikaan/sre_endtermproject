apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatservice
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatservice
  template:
    metadata:
      labels:
        app: chatservice
    spec:
      containers:
        - name: chatservice
          image: webbackendfinal-chatservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: app-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatservice
  namespace: microservices
spec:
  selector:
    app: chatservice
  ports:
    - port: 3005
      targetPort: 3005
  type: NodePort