apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      containers:
        - name: authservice
          image: webbackendfinal-authservice:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: app-secret
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  namespace: microservices
spec:
  selector:
    app: authservice
  ports:
    - port: 3001
      targetPort: 3001